[reach]
	#Grip Reach of a Copper Rig, blocks. Far Reach adds to it, up to 16 in total
	# Default: 5.0
	# Range: 1.0 ~ 16.0
	copper = 5.0
	#Grip Reach of a Netherite Rig, blocks. Far Reach adds to it, up to 16 in total
	# Default: 7.0
	# Range: 1.0 ~ 16.0
	netherite = 7.0

[speed]
	#Base top Rig speed, before Swift, in blocks per second: the highest Speed a player can set in Rig Settings. Swift multiplies it on its own Rig
	# Default: 8.0
	# Range: 1.0 ~ 20.0
	max = 8.0
	#Stow a Rig that moves faster than its top Speed (anti-cheat). Off: the server trusts the wearer's speed, for servers that lag
	check = true

[air]
	#Copper Rig held still (Idle, Hang): ticks per 1 Air
	# Default: 80.0
	# Range: 1.0 ~ 72000.0
	idle = 80.0
	#Copper Rig moving level or down: ticks per 1 Air
	# Default: 20.0
	# Range: 1.0 ~ 72000.0
	move = 20.0
	#Copper Rig climbing (net +Y): ticks per 1 Air
	# Default: 10.0
	# Range: 1.0 ~ 72000.0
	climb = 10.0
	#Air use of a Netherite Rig relative to Copper
	# Default: 0.5
	# Range: 0.0 ~ 4.0
	netheriteFactor = 0.5
	#Max Air of a Rig relative to a Backtank of the same Capacity
	# Default: 2.0
	# Range: 1.0 ~ 8.0
	capacityFactor = 2.0
	#Copper Rig: Air per Far Use (one block or mob action past arm's length)
	# Default: 0.5
	# Range: 0.0 ~ 50.0
	farUse = 0.5
	#Copper Rig holding a Grab: ticks per 1 Air
	# Default: 40.0
	# Range: 1.0 ~ 72000.0
	grab = 40.0
	#Copper Rig: Air per Throw
	# Default: 10.0
	# Range: 0.0 ~ 500.0
	throw = 10.0
	#Copper Rig: Air per Dual Wield action (a block broken or a hit the off-hand item helped with)
	# Default: 0.5
	# Range: 0.0 ~ 50.0
	dualWield = 0.5

[farUse]
	#Far Use may hit and use on players (the PvP rule still applies)
	players = true

[actuators]
	#Dual Wield: with both Actuators free, the off-hand item works along with the main-hand one (mining speed, melee damage)
	dualWield = true

[grab]
	#Grab may take another player's tamed, owned or leashed animal
	tamedOthers = false
	#Grab may take Sable Ships (also needs ships.grip). Ignored without Sable
	ships = true
	#Walking and Rig Speed while both Actuators hold a heavy target, relative to normal
	# Default: 0.6
	# Range: 0.1 ~ 1.0
	heavySpeedFactor = 0.6

	[grab.massCap]
		#Heaviest Ship a Copper Rig can Grab, Sable mass
		# Default: 2000.0
		# Range: 0.0 ~ 1000000.0
		copper = 2000.0
		#Heaviest Ship a Netherite Rig can Grab, Sable mass
		# Default: 6000.0
		# Range: 0.0 ~ 1000000.0
		netherite = 6000.0

	[grab.throwSpeed]
		#Throw speed of a Copper Rig, blocks per tick
		# Default: 0.8
		# Range: 0.1 ~ 5.0
		copper = 0.8
		#Throw speed of a Netherite Rig, blocks per tick
		# Default: 1.2
		# Range: 0.1 ~ 5.0
		netherite = 1.2

[impact]
	#Impact damage per block per tick of speed above the minimum, dealt once per Throw
	# Default: 12.0
	# Range: 0.0 ~ 100.0
	damagePerSpeed = 12.0
	#Slowest Thrown speed that deals Impact damage, blocks per tick
	# Default: 0.3
	# Range: 0.0 ~ 5.0
	minSpeed = 0.3
	#Most Impact damage one Throw can deal
	# Default: 20.0
	# Range: 0.0 ~ 1000.0
	cap = 20.0

[crawl]
	#Descent speed with no Air left (Crawl), blocks per second
	# Default: 1.0
	# Range: 0.1 ~ 8.0
	speed = 1.0

[enchant]
	#Far Reach: extra Reach per level, blocks
	# Default: 1.0
	# Range: 0.0 ~ 8.0
	farReachPerLevel = 1.0
	#Thrift: Air use cut per level (0.15 = -15 %). Level III stays above zero
	# Default: 0.15
	# Range: 0.0 ~ 0.3
	thriftPerLevel = 0.15
	#Swift: extra Speed per level (0.15 = +15 %)
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	swiftPerLevel = 0.15

[ships]
	#Rigs grip Sable Ships like world blocks. Ignored without Sable
	grip = true

[curios]
	#A Rig in the Curios back slot works (Air, Reach, Rig Settings) but is not armor. Off: the back slot refuses Rigs and one already there does nothing. Ignored without Curios
	backSlot = true
