[animation]
	#Vanilla walk animation (swinging arms and legs) while the Rig carries you or a Ship carries you with it. Off: the body hangs still
	walkWhileHeld = false

[movement]
	#What W and S follow while the Rig carries you. LOOK: the camera, look down and W takes you down. FLAT: level only, like walking or creative flight; jump and sneak change the height
	#Allowed Values: LOOK, FLAT
	forward = "LOOK"

[firstPerson]
	#Opacity of every Limb (Tentacles and Actuators) in first person: 1.0 solid, 0.1 faint
	# Default: 1.0
	# Range: 0.1 ~ 1.0
	limbOpacity = 1.0

[hud]
	#Actuator marks around the crosshair: what the Actuators reach and hold, the Grab cue, Dual Wield
	crosshair = true
	#Key hints for the first two holds of a game session: the Grab key beside the crosshair and, after a Grab, the keys for Set Down, Throw and Distance above the hotbar
	hints = true
